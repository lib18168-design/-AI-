<!-- 功能页面容器（动态加载内容） -->

<script src="{{ url_for('static', filename='js/common.js') }}"></script>
<script src="{{ url_for('static', filename='js/history.js') }}"></script>
<script src="{{ url_for('static', filename='js/imageAnalysis.js') }}"></script>
<script src="{{ url_for('static', filename='js/videoPrompt.js') }}"></script>
<script src="{{ url_for('static', filename='js/visualParse.js') }}"></script>
<script src="{{ url_for('static', filename='js/aiGenerate.js') }}"></script>
<script>
    // 全局 showToast
    if (typeof window.showToast !== 'function') {
        window.showToast = function(msg) {
            const toast = document.getElementById('toast');
            if (toast) {
                toast.innerText = msg;
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 3000);
            }
        };
    }

    // 页面切换
    function showPage(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        if (pageId === 'home') {
            document.getElementById('homePage').classList.add('active');
        } else {
            const targetPage = document.getElementById(pageId + 'Page');
            if (targetPage) targetPage.classList.add('active');
            loadComponentIfNeeded(pageId);
        }
    }

    // 加载组件
    async function loadComponentIfNeeded(componentName) {
        const containerId = componentName + 'Container';
        const container = document.getElementById(containerId);
        if (!container || container.dataset.loaded === 'true') return;
        try {
            const url = `/static/components/${componentName}.html`;
            const response = await fetch(url);
            const html = await response.text();
            container.innerHTML = html;
            container.dataset.loaded = 'true';
            const initFunc = window['init' + componentName.charAt(0).toUpperCase() + componentName.slice(1)];
            if (typeof initFunc === 'function') initFunc();
        } catch (err) {
            console.error(`加载组件 ${componentName} 失败:`, err);
            container.innerHTML = '<div class="text-red-500 text-center py-10">加载失败，请刷新重试</div>';
        }
    }

    // 绑定卡片点击事件
    document.querySelectorAll('.feature-card').forEach(card => {
        card.addEventListener('click', () => {
            const page = card.getAttribute('data-page');
            if (page) showPage(page);
        });
    });

    if (typeof window.initHistory === 'function') window.initHistory();
    showPage('home');
</script>
</body>
