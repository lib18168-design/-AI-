<div class="flex flex-col lg:flex-row gap-8">
    <!-- 左侧：配置区 -->
    <div class="lg:w-1/2 space-y-4">
        <!-- 文生图主卡片 -->
        <div class="bg-white/90 backdrop-blur-sm rounded-3xl shadow-xl p-5 transition-all duration-300 hover:shadow-2xl">
            <div class="flex items-center justify-between gap-2 mb-5 pb-2 border-b border-gray-100">
                <i class="fas fa-magic text-indigo-500 text-xl"></i>
                <h3 class="text-xl font-semibold text-gray-800 flex-1 text-center">文生图</h3>
                <span class="text-xs text-gray-400 bg-gray-100 px-2 py-1 rounded-full">v2.0</span>
            </div>

            <!-- 增强输入框（应用 x-composer-box） -->
            <div class="x-composer-box mb-4">
                <textarea id="imagePrompt" rows="5" placeholder="例如：一款简约风格的白色陶瓷咖啡杯，带金色把手，纯白背景，产品摄影，8K"></textarea>
                <div class="x-composer-toolbar">
                    <button id="optimizePromptBtn" class="text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-600 px-2 py-1 rounded-full transition">✨ 优化提示词</button>
                    <div class="flex-1"></div>
                    <span class="text-xs text-gray-400">按需修改</span>
                </div>
            </div>

            <!-- 比例 + 质量（保留原有样式） -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">图片比例</label>
                    <select id="imageSize" class="w-full p-2 border border-gray-200 rounded-xl bg-gray-50/60 text-sm">
                        <option value="1:1">1:1 正方形</option>
                        <option value="16:9" selected>16:9 横版 (推荐)</option>
                        <option value="9:16">9:16 竖版</option>
                        <option value="3:2">3:2 横版</option>
                        <option value="2:3">2:3 竖版</option>
                        <option value="4:3">4:3 横版</option>
                        <option value="3:4">3:4 竖版</option>
                        <option value="2:1">2:1 超宽</option>
                        <option value="21:9">21:9 电影宽屏</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">图片质量</label>
                    <div class="flex gap-3 bg-gray-50/60 p-2 rounded-xl">
                        <label class="flex items-center gap-1.5 cursor-pointer text-sm"><input type="radio" name="resolution" value="1k" class="w-4 h-4 accent-indigo-500"> <span>1K</span></label>
                        <label class="flex items-center gap-1.5 cursor-pointer text-sm"><input type="radio" name="resolution" value="2k" checked class="w-4 h-4 accent-indigo-500"> <span>2K</span></label>
                        <label class="flex items-center gap-1.5 cursor-pointer text-sm"><input type="radio" name="resolution" value="4k" class="w-4 h-4 accent-indigo-500"> <span>4K</span></label>
                    </div>
                </div>
            </div>

            <!-- 参考图上传（原有，无需改动） -->
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">参考图（可选，最多10张）</label>
                <div id="refImageUploadArea" class="border-2 border-dashed border-gray-200 rounded-2xl p-4 text-center cursor-pointer hover:border-indigo-400 hover:bg-indigo-50/30 transition-all">
                    <i class="fas fa-cloud-upload-alt text-2xl text-gray-400 mb-1"></i>
                    <p class="text-sm text-gray-500">点击或拖拽图片上传</p>
                    <p class="text-xs text-gray-400">JPG / PNG / WebP，每张 ≤10MB</p>
                    <input type="file" id="refImageInput" accept="image/*" multiple class="hidden">
                </div>
                <div id="refImagePreviewContainer" class="flex flex-wrap gap-2 mt-2"></div>
            </div>

            <!-- 生成按钮 -->
            <button id="generateImageBtn" class="w-full bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-medium py-3 rounded-2xl shadow-md hover:shadow-lg transition-all hover:-translate-y-0.5 active:translate-y-0 flex justify-center items-center gap-2">
                <i class="fas fa-sparkles"></i> 生成图片
            </button>
        </div>

        <!-- 风格市场卡片（新样式） -->
        <div class="bg-white/90 backdrop-blur-sm rounded-3xl shadow-xl p-5">
            <div class="flex items-center justify-between mb-3">
                <h3 class="text-xl font-semibold text-gray-800 flex items-center gap-2">
                    <i class="fas fa-palette text-pink-500"></i> 风格市场
                </h3>
                <span class="text-xs text-gray-400 bg-gray-100 px-2 py-1 rounded-full">点击应用风格</span>
            </div>

            <!-- 搜索与筛选（保留原有） -->
            <div class="flex flex-wrap gap-2 mb-3">
                <input type="search" id="styleSearchInput" placeholder="搜索风格..." class="flex-1 min-w-[120px] px-3 py-1.5 text-sm border border-gray-200 rounded-full bg-gray-50 focus:ring-1 focus:ring-indigo-300 outline-none">
                <div class="flex gap-1">
                    <button data-filter="all" class="filter-btn-style text-xs px-3 py-1.5 rounded-full bg-indigo-50 text-indigo-600 font-medium">全部</button>
                    <button data-filter="popular" class="filter-btn-style text-xs px-3 py-1.5 rounded-full bg-gray-100 text-gray-700 hover:bg-gray-200">热门</button>
                    <button data-filter="recent" class="filter-btn-style text-xs px-3 py-1.5 rounded-full bg-gray-100 text-gray-700 hover:bg-gray-200">最近</button>
                    <button data-filter="favorite" class="filter-btn-style text-xs px-3 py-1.5 rounded-full bg-gray-100 text-gray-700 hover:bg-gray-200">收藏</button>
                </div>
            </div>

            <!-- 横向滚动容器（应用 x-style-strip） -->
            <div id="styleCardStrip" class="x-style-strip">
                <!-- 动态卡片将注入此处 -->
                <div class="text-center text-gray-400 w-full py-6">加载风格中...</div>
            </div>

            <div class="mt-3 text-xs text-gray-500">
                <span id="selectedStyleName" class="truncate">👆 点击任意风格卡片</span>
            </div>
        </div>
    </div>

    <!-- 右侧：预览区、最近生成、示例提示词（保留原有结构） -->
    <div class="lg:w-1/2">
        <div class="bg-white/90 backdrop-blur-sm rounded-3xl shadow-xl p-5 sticky top-8 flex flex-col gap-4">
            <!-- 预览区 -->
            <div>
                <div class="flex items-center justify-center gap-2 mb-3">
                    <i class="fas fa-eye text-green-500"></i>
                    <h3 class="text-xl font-semibold text-gray-800">预览区</h3>
                </div>
                <div id="rightImageContainer" class="mb-2">
                    <div id="noImagePlaceholder" class="flex flex-col items-center justify-center text-gray-400 py-8">
                        <i class="fas fa-image text-5xl mb-2 opacity-30"></i>
                        <p class="text-sm">生成后的图片将显示在此处</p>
                    </div>
                    <div id="generatedImageWrapper" class="hidden relative">
                        <img id="generatedImageRight" class="w-full rounded-2xl border border-gray-200" alt="生成的图片">
                        <button id="downloadImageRightBtn" class="absolute bottom-3 right-3 bg-white/80 backdrop-blur text-sm text-indigo-600 px-3 py-1.5 rounded-full shadow-sm hover:bg-white transition">📥 下载</button>
                    </div>
                </div>
            </div>

            <!-- 最近生成（保留原有） -->
            <div class="border-t border-gray-100 pt-3">
                <div class="flex items-center justify-between mb-2">
                    <h4 class="text-sm font-medium text-gray-700">最近生成</h4>
                    <button id="clearHistoryBtn" class="text-xs text-gray-400 hover:text-red-500">清空记录</button>
                </div>
                <div id="recentImagesContainer" class="flex flex-wrap gap-2 max-h-32 overflow-y-auto"></div>
            </div>

            <!-- 示例提示词（保留原有） -->
            <div class="border-t border-gray-100 pt-3">
                <div class="flex items-center gap-2 mb-2">
                    <i class="fas fa-lightbulb text-yellow-500"></i>
                    <h4 class="text-sm font-medium text-gray-700">示例提示词</h4>
                </div>
                <div class="flex flex-wrap gap-2" id="examplePromptsContainer">
                    <span class="example-prompt text-xs bg-gray-100 hover:bg-gray-200 px-3 py-1.5 rounded-full cursor-pointer">白色陶瓷咖啡杯，极简风格，产品摄影</span>
                    <span class="example-prompt text-xs bg-gray-100 hover:bg-gray-200 px-3 py-1.5 rounded-full cursor-pointer">科幻城市，霓虹灯，赛博朋克，未来感</span>
                    <span class="example-prompt text-xs bg-gray-100 hover:bg-gray-200 px-3 py-1.5 rounded-full cursor-pointer">一只橘猫，水彩画风，温暖阳光</span>
                    <span class="example-prompt text-xs bg-gray-100 hover:bg-gray-200 px-3 py-1.5 rounded-full cursor-pointer">复古胶片色调，咖啡馆，慵懒午后</span>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    /* 确保风格卡片内部图片背景占满（动态添加到卡片上） */
    .x-style-card {
        background-size: cover;
        background-position: center;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
</style>
